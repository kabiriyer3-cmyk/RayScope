# Перенесите этот файл в .github/workflows/build.yml (см. README)
name: Build & Release APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
    paths-ignore: [ '**.md' ]
  workflow_dispatch:

permissions:
  contents: write
  issues: write

env:
  # Xray core for Android (2dust/AndroidLibXrayLite)
  XRAY_LIB_TAG: v26.10.17

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Download Xray core (libv2ray.aar)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p app/libs
          gh release download "$XRAY_LIB_TAG" --repo 2dust/AndroidLibXrayLite --pattern "*.aar" --dir app/libs
          ls -la app/libs

      - name: Version
        id: ver
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            NAME="${GITHUB_REF#refs/tags/v}"
            TAG="${GITHUB_REF#refs/tags/}"
          else
            NAME="1.0.${{ github.run_number }}"
            TAG="v$NAME"
          fi
          echo "VERSION_NAME=$NAME" >> "$GITHUB_ENV"
          echo "VERSION_CODE=${{ github.run_number }}" >> "$GITHUB_ENV"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - name: Signing key
        env:
          KS_B64: ${{ secrets.KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          K_ALIAS: ${{ secrets.KEY_ALIAS }}
          K_PASS: ${{ secrets.KEY_PASSWORD }}
        run: |
          KS="$RUNNER_TEMP/release.p12"
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$KS"
            echo "KEYSTORE_PASSWORD=$KS_PASS" >> "$GITHUB_ENV"
            echo "KEY_ALIAS=$K_ALIAS" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=$K_PASS" >> "$GITHUB_ENV"
            echo "Using keystore from repository secrets"
          else
            base64 -d keystore/release.p12.b64 > "$KS"
            echo "KEYSTORE_PASSWORD=rayscope123" >> "$GITHUB_ENV"
            echo "KEY_ALIAS=rayscope" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=rayscope123" >> "$GITHUB_ENV"
            echo "::warning::Using the public demo keystore from the repo. Add KEYSTORE_BASE64 / KEYSTORE_PASSWORD / KEY_ALIAS / KEY_PASSWORD secrets to sign with your own key."
          fi
          echo "KEYSTORE_FILE=$KS" >> "$GITHUB_ENV"

      - name: Build APK
        shell: bash
        run: |
          set -o pipefail
          gradle :app:assembleRelease --no-daemon --stacktrace 2>&1 | tee build.log

      - name: Collect APKs
        run: |
          mkdir -p dist
          for f in app/build/outputs/apk/release/*.apk; do
            b=$(basename "$f" .apk)
            abi=${b#app-}
            abi=${abi%-release}
            cp "$f" "dist/RayScope-${{ steps.ver.outputs.name }}-${abi}.apk"
          done
          (cd dist && sha256sum *.apk > SHA256SUMS.txt)
          ls -la dist

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: RayScope-${{ steps.ver.outputs.name }}
          path: dist/*

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: RayScope ${{ steps.ver.outputs.name }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          body: |
            ## RayScope ${{ steps.ver.outputs.name }}

            Android VPN-клиент на Xray-core (${{ env.XRAY_LIB_TAG }}) с расширенной диагностикой.

            **Какой APK скачать:**
            - `arm64-v8a`: почти все современные телефоны
            - `armeabi-v7a`: старые 32-битные устройства
            - `x86_64` / `x86`: эмуляторы и Chromebook
            - `universal`: подойдёт куда угодно (самый тяжёлый)

            Контрольные суммы в `SHA256SUMS.txt`.
          files: dist/*

      - name: Report build failure as issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "CI build #${{ github.run_number }} failed for commit ${{ github.sha }}"
            echo ""
            echo "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo ""
            echo '```'
            if [ -f build.log ]; then
              grep -E "^e: |error:|What went wrong|Could not|Exception|FAILED" build.log | head -n 150
              echo "----- tail -----"
              tail -n 60 build.log
            else
              echo "build.log not found (failed before Gradle step)"
            fi
            echo '```'
          } > issue.md
          gh issue create --repo "${{ github.repository }}" --title "CI build #${{ github.run_number }} failed" --body-file issue.md || true
